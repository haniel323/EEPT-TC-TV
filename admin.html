<html lang="fr">
<head>

<title>Administration — EEPT Tokoin Centre</title>
<meta name="theme-color" content="#0a2540">

<style>
:root { --navy:#0a2540; --blue:#034576; --blue-soft:#e6eef5; --gold:#d4a24c; --cream:#f7f4ee; --paper:#fff; --ink:#14212e; --muted:#5b6b7b; --line:#e3ddd1; --red:#d93a3a; --green:#1f7a4d; --radius:14px; --shadow:0 1px 2px rgba(10,37,64,.06),0 8px 24px rgba(10,37,64,.08); --serif:Georgia,'Times New Roman',serif; --sans:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; }
@media (prefers-color-scheme: dark) { :root { --cream:#0c1824; --paper:#12212f; --ink:#eef2f6; --muted:#9fb0c1; --line:#223548; --blue-soft:#16304a; --green:#5fd08f; } }
* { box-sizing:border-box; }
body { margin:0; background:var(--cream); color:var(--ink); font:16px/1.55 var(--sans); }
button { font:inherit; cursor:pointer; }
.top { background:var(--navy); color:#fff; border-bottom:3px solid var(--gold); }
.wrap { width:min(900px,100% - 32px); margin-inline:auto; }
.top .wrap { display:flex; align-items:center; gap:16px; flex-wrap:wrap; min-height:60px; padding-block:6px; }
.brand { font-family:var(--serif); font-weight:700; font-size:1.1rem; margin-right:auto; color:#fff; text-decoration:none; }
.top a.tab, .top button.tab { color:#cfdbe8; text-decoration:none; padding:7px 14px; border-radius:999px; font-size:.95rem; background:none; border:0; }
.top a.tab:hover, .top button.tab:hover { background:rgba(255,255,255,.1); color:#fff; }
nav { display:flex; gap:4px; flex-wrap:wrap; }
nav .tab[aria-current] { background:#fff; color:var(--navy); }
main { padding-block:24px 56px; }
.panel { background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); padding:20px; box-shadow:var(--shadow); margin-bottom:18px; }
h1,h2 { font-family:var(--serif); line-height:1.2; margin:0 0 10px; }
h2 { font-size:1.3rem; }
label { display:block; font-weight:600; font-size:.9rem; margin:12px 0 4px; }
input[type=text],input[type=password],input[type=date],input[type=url],textarea,select { width:100%; padding:10px 12px; border:1.5px solid var(--line); border-radius:10px; background:var(--cream); color:var(--ink); font:inherit; }
textarea { min-height:70px; resize:vertical; }
.btn { display:inline-flex; align-items:center; gap:8px; border:0; border-radius:999px; padding:10px 20px; font-weight:600; background:var(--gold); color:#1b1405; }
.btn:disabled { opacity:.55; cursor:wait; }
.btn.small { padding:6px 14px; font-size:.88rem; }
.btn.stop { background:var(--red); color:#fff; }
.btn.ghost { background:transparent; color:var(--ink); border:1.5px solid var(--line); }
.btn.danger { background:transparent; color:var(--red); border:1.5px solid var(--red); }
.meta { color:var(--muted); font-size:.88rem; }
.row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
@media (max-width:600px){ .grid2{grid-template-columns:1fr;} }
.item { display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--line); }
.item img, .item .ph { width:64px; height:44px; object-fit:cover; border-radius:8px; background:var(--blue-soft); flex:none; }
.item .t { flex:1; min-width:0; }
.item .t b { display:block; overflow-wrap:anywhere; }
.note { background:var(--blue-soft); border-radius:10px; padding:10px 14px; font-size:.92rem; }
.ok { color:var(--green); font-weight:600; }
.err { color:var(--red); font-weight:600; }
.sw { display:flex; gap:10px; align-items:center; font-weight:600; margin:0; }
.sw input { width:20px; height:20px; }
.steps { padding-left:20px; margin:8px 0 0; }
.steps li { margin:6px 0; }
.progress { height:8px; border-radius:99px; background:var(--line); overflow:hidden; margin-top:6px; }
.progress i { display:block; height:100%; width:0; background:var(--gold); }
.editor { background:var(--blue-soft); border-radius:10px; padding:4px 14px 14px; margin:6px 0 10px; }
.editor input,.editor textarea,.editor select { background:var(--paper); }
:focus-visible { outline:3px solid var(--gold); outline-offset:2px; }
.thumbs { display: flex; flex-wrap: wrap; gap: 6px; max-height: 320px; overflow: auto; }
.th { position: relative; } .th img { width: 76px; height: 76px; object-fit: cover; border-radius: 8px; display: block; }
.th .btn { position: absolute; top: 3px; right: 3px; min-height: 0; padding: 0 7px; line-height: 22px; font-size: 1rem; }
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="./">EEPT Tokoin Centre · Administration</a>
  <nav id="nav" hidden aria-label="Administration">
    <a class="tab" href="#direct" data-tab="direct">Direct</a>
    <a class="tab" href="#videos" data-tab="videos">Vidéos</a>
    <a class="tab" href="#photos" data-tab="photos">Photos</a>
    <a class="tab" href="#audios" data-tab="audios">Audios</a>
    <a class="tab" href="#annonces" data-tab="annonces">Informations et verset</a>
    <a class="tab" href="#infos" data-tab="infos">Réseaux et contact</a>
    <a class="tab" href="./">Voir le site</a>
    <button class="tab" id="logout" type="button">Déconnexion</button>
  </nav>
</div></header>
<main class="wrap" id="app"></main>

<script>
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const app = $('#app');
const store = {
  get(k) { try { return localStorage.getItem(k) || ''; } catch { return ''; } },
  set(k, v) { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch {} },
};

/* ───── Dépôt GitHub détecté depuis l'adresse du site ───── */
const detected = (() => {
  const h = location.hostname;
  if (h.endsWith('.github.io')) return { owner: h.split('.')[0], repo: location.pathname.split('/')[1] || (h.split('.')[0] + '.github.io') };
  return { owner: '', repo: '' };
})();
let cfg = { owner: store.get('eept_owner') || detected.owner, repo: store.get('eept_repo') || detected.repo, token: store.get('eept_token') };
let data = null, sha = null, tab = 'direct';

const b64 = (s) => btoa(unescape(encodeURIComponent(s)));
const unb64 = (s) => decodeURIComponent(escape(atob(s.replace(/\s/g, ''))));

async function gh(path, opts = {}) {
  const r = await fetch('https://api.github.com' + path, {
    ...opts,
    headers: { Authorization: 'Bearer ' + cfg.token, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', ...(opts.body ? { 'Content-Type': 'application/json' } : {}) },
  });
  if (!r.ok) {
    let m = r.status + ''; try { m = (await r.json()).message || m; } catch {}
    const e = new Error(m); e.status = r.status; throw e;
  }
  return r.status === 204 ? null : r.json();
}
const repoPath = () => `/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}`;

async function loadData() {
  const j = await gh(`${repoPath()}/contents/contenu.json?t=${Date.now()}`);
  sha = j.sha;
  let d = {}; try { d = JSON.parse(unb64(j.content)); } catch {}
  d.google = { apiKey: '', clientId: '', ...(d.google || {}) };
  d.direct = { actif: false, titre: 'Culte en direct', description: '', youtube: '', hls: '', ...(d.direct || {}) };
  d.reseaux = { pasteur: {}, eglise: {}, ...(d.reseaux || {}) }; d.reseaux.pasteur = d.reseaux.pasteur || {}; d.reseaux.eglise = d.reseaux.eglise || {};
  d.contact = d.contact || {}; d.verset = { texte: '', reference: '', date: '', ...(d.verset || {}) };
  for (const k of ['infos', 'autres', 'programme', 'programmation', 'emissions']) if (!Array.isArray(d[k])) d[k] = []; d.don = { texte: '', lien: '', details: '', ...(d.don || {}) };
  for (const k of ['videos', 'photos', 'audios']) if (!Array.isArray(d[k])) d[k] = [];
  data = d;
}
async function saveData(msg) {
  const body = { message: msg, content: b64(JSON.stringify(data, null, 2) + '\n'), sha };
  try {
    const j = await gh(`${repoPath()}/contents/contenu.json`, { method: 'PUT', body: JSON.stringify(body) });
    sha = j.content.sha;
  } catch (e) {
    if (e.status === 409 || e.status === 422) throw new Error('Le fichier a changé entre-temps. Rechargez la page puis recommencez.');
    throw e;
  }
}
async function putFile(path, base64, msg) {
  await gh(`${repoPath()}/contents/${path.split('/').map(encodeURIComponent).join('/')}`, { method: 'PUT', body: JSON.stringify({ message: msg, content: base64 }) });
}
async function deleteFile(path) {
  try {
    const p = `${repoPath()}/contents/${path.split('/').map(encodeURIComponent).join('/')}`;
    const j = await gh(p);
    await gh(p, { method: 'DELETE', body: JSON.stringify({ message: 'Supprimer ' + path, sha: j.sha }) });
  } catch (e) { /* fichier déjà absent */ }
}

/* Envoi groupé : un seul « commit » pour des centaines de fichiers (Git Data API) */
let branchName = null;
async function commitBatch(files, deletes, msg, onProgress) {
  if (!branchName) branchName = (await gh(repoPath())).default_branch || 'main';
  const cur = await gh(`${repoPath()}/contents/contenu.json?t=${Date.now()}`);
  if (cur.sha !== sha) throw new Error('Le contenu du site a changé entre-temps. Rechargez la page puis recommencez.');
  const ref = await gh(`${repoPath()}/git/ref/heads/${encodeURIComponent(branchName)}`);
  const head = await gh(`${repoPath()}/git/commits/${ref.object.sha}`);
  const tree = []; let done = 0;
  const blob = async (content, encoding) => (await gh(`${repoPath()}/git/blobs`, { method: 'POST', body: JSON.stringify({ content, encoding }) })).sha;
  const queue = files.slice(); const total = queue.length + 1;
  const worker = async () => { for (;;) { const f = queue.shift(); if (!f) return; const h = await blob(f.b64, 'base64'); tree.push({ path: f.path, mode: '100644', type: 'blob', sha: h }); onProgress && onProgress(++done, total); } };
  await Promise.all([worker(), worker(), worker(), worker()]);
  const cj = await blob(b64(JSON.stringify(data, null, 2) + '\n'), 'base64');
  tree.push({ path: 'contenu.json', mode: '100644', type: 'blob', sha: cj });
  (deletes || []).forEach((p) => tree.push({ path: p, mode: '100644', type: 'blob', sha: null }));
  const t = await gh(`${repoPath()}/git/trees`, { method: 'POST', body: JSON.stringify({ base_tree: head.tree.sha, tree }) });
  const c = await gh(`${repoPath()}/git/commits`, { method: 'POST', body: JSON.stringify({ message: msg, tree: t.sha, parents: [ref.object.sha] }) });
  await gh(`${repoPath()}/git/refs/heads/${encodeURIComponent(branchName)}`, { method: 'PATCH', body: JSON.stringify({ sha: c.sha }) });
  onProgress && onProgress(total, total);
  sha = (await gh(`${repoPath()}/contents/contenu.json?t=${Date.now()}`)).sha;
}

/* ───── Outils ───── */
function ytId(v) {
  v = String(v || '').trim(); if (!v) return '';
  const m = v.match(/(?:youtu\.be\/|[?&]v=|\/live\/|\/embed\/|\/shorts\/)([\w-]{11})/);
  if (m) return m[1];
  return /^[\w-]{11}$/.test(v) ? v : '';
}
const today = () => new Date().toISOString().slice(0, 10);
const slug = (s) => s.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\.[^.]+$/, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40) || 'fichier';
const fileB64 = (blob) => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = rej; r.readAsDataURL(blob); });
async function resizeImage(file, max = 1600, q = 0.85) {
  const bmp = await createImageBitmap(file);
  const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height); if (bmp.close) bmp.close();
  return new Promise((res) => c.toBlob(res, 'image/jpeg', q));
}
function status(el, msg, ok) { el.className = ok === false ? 'err' : ok ? 'ok' : 'meta'; el.textContent = msg; }
const SAVED = 'Enregistré ✓ Le site se met à jour dans 1 à 2 minutes.';

/* ───── Écran de connexion ───── */
function loginView() {
  $('#nav').hidden = true;
  app.innerHTML = `<div class="panel"><h1>Connexion</h1>
    <p class="meta">Cette page modifie le fichier <b>contenu.json</b> de votre dépôt GitHub. Elle a besoin d'une clé personnelle GitHub (un « token »), que vous seul possédez.</p>
    <div class="note"><b>Créer la clé (une seule fois)</b><ol class="steps">
      <li>Ouvrez <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">github.com/settings/personal-access-tokens/new</a>.</li>
      <li>Nom : <i>Administration du site</i>. Expiration : à votre choix (ex. 1 an).</li>
      <li><b>Repository access</b> : « Only select repositories », puis choisissez votre dépôt du site.</li>
      <li><b>Permissions → Repository permissions → Contents</b> : « Read and write ».</li>
      <li>Cliquez sur « Generate token » et copiez la clé (elle commence par <code>github_pat_</code>).</li></ol></div>
    <label for="tok">Clé GitHub</label><input id="tok" type="password" autocomplete="off" placeholder="github_pat_…">
    <div class="grid2"><div><label for="own">Compte GitHub</label><input id="own" type="text" value="${esc(cfg.owner)}"></div>
    <div><label for="rep">Nom du dépôt</label><input id="rep" type="text" value="${esc(cfg.repo)}"></div></div>
    <label class="sw" style="margin-top:14px"><input type="checkbox" id="rem" checked> Rester connecté sur cet ordinateur</label>
    <p class="meta" id="msg" role="alert" style="min-height:1.4em"></p>
    <button class="btn" id="go">Se connecter</button></div>`;
  $('#go').onclick = async () => {
    cfg = { owner: $('#own').value.trim(), repo: $('#rep').value.trim(), token: $('#tok').value.trim() };
    const m = $('#msg'); status(m, 'Vérification…');
    try {
      const r = await gh(repoPath());
      if (!r.permissions || !r.permissions.push) throw new Error("Cette clé n'a pas le droit d'écrire dans ce dépôt (permission « Contents : Read and write »).");
      await loadData();
      if ($('#rem').checked) { store.set('eept_token', cfg.token); store.set('eept_owner', cfg.owner); store.set('eept_repo', cfg.repo); }
      start();
    } catch (e) { status(m, e.status === 401 ? 'Clé refusée. Vérifiez-la.' : e.status === 404 ? 'Dépôt introuvable (nom ou accès de la clé).' : e.message, false); }
  };
}

/* ───── Application ───── */
async function start() {
  if (!cfg.token) return loginView();
  if (!data) { try { await loadData(); } catch (e) { store.set('eept_token', ''); cfg.token = ''; return loginView(); } }
  $('#nav').hidden = false;
  tab = location.hash.slice(1) || 'direct';
  if (!['direct', 'videos', 'photos', 'audios', 'infos', 'annonces'].includes(tab)) tab = 'direct';
  document.querySelectorAll('[data-tab]').forEach((a) => (a.dataset.tab === tab ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current')));
  ({ direct: directView, videos: videosView, photos: photosView, audios: audiosView, infos: infosView, annonces: annoncesView })[tab]();
}
window.addEventListener('hashchange', () => { if (data) start(); });
$('#logout').onclick = () => { store.set('eept_token', ''); cfg.token = ''; data = null; loginView(); };

/* Direct */
/* Émissions (catalogue vidéo) */
const EM_BUILTIN = ['Cultes du dimanche', 'Temps de prière', 'Shorts', 'Autres vidéos'];
function emissionNames() { return [...new Set([...data.videos.map((v) => v.emission).filter(Boolean), ...data.emissions.map((e) => e.nom)])]; }
function emissionsPanel() {
  const names = emissionNames();
  const rows = !names.length ? '<p class="meta">Les émissions apparaissent ici dès que vous en nommez une en ajoutant une vidéo.</p>' : names.map((n, k) => {
    const c = data.emissions.find((e) => e.nom === n) || {}, cnt = data.videos.filter((v) => v.emission === n).length;
    return `<div class="item" style="display:block"><div class="row" style="gap:12px;align-items:center">${c.image ? `<img src="${esc(c.image)}" alt="" style="width:48px;height:72px;object-fit:cover;border-radius:8px">` : '<span style="width:48px;height:72px;border-radius:8px;background:#e8edf5;display:inline-block"></span>'}<span class="t" style="flex:1"><b>${esc(n)}</b><span class="meta"> ${cnt} vidéo${cnt > 1 ? 's' : ''}</span></span></div>
      <label>Affiche (image verticale, facultative)</label><input type="file" accept="image/*" data-emimg="${k}">
      <label>Description (facultative)</label><input type="text" data-emdesc="${k}" value="${esc(c.description || '')}" maxlength="300">
      <p style="margin-top:8px"><button class="btn small" data-emsave="${k}">Enregistrer cette émission</button> <span class="meta" data-emst="${k}"></span></p></div>`;
  }).join('');
  return `<div class="panel"><h2>Émissions</h2><p class="meta">Chaque émission s'affiche sur le site comme une affiche dans le catalogue. Ajoutez une affiche et une description pour la personnaliser (sinon, la miniature de la dernière vidéo est utilisée).</p>${rows}</div>`;
}
function bindEmissions() {
  const names = emissionNames();
  document.querySelectorAll('[data-emsave]').forEach((b) => (b.onclick = async () => {
    const k = +b.dataset.emsave, n = names[k], st = document.querySelector(`[data-emst="${k}"]`);
    const file = document.querySelector(`[data-emimg="${k}"]`).files[0], desc = document.querySelector(`[data-emdesc="${k}"]`).value.trim();
    let c = data.emissions.find((e) => e.nom === n); const created = !c; if (!c) { c = { nom: n }; data.emissions.push(c); }
    const before = JSON.stringify(c); b.disabled = true; status(st, 'Enregistrement…');
    try {
      if (file) { const blob = await resizeImage(file, 900); const p = `emissions/${slug(n)}-${Date.now().toString(36)}.jpg`; await putFile(p, await fileB64(blob), 'Affiche : ' + n); c.image = p; }
      if (desc) c.description = desc; else delete c.description;
      await saveData('Émission : ' + n); status(st, SAVED, true); if (file) start();
    } catch (e) { if (created) data.emissions.pop(); else Object.assign(c, JSON.parse(before)); status(st, e.message, false); }
    b.disabled = false;
  }));
}

/* Programmation des directs (onglet « À suivre » de la page Direct) */
function programmationPanel() {
  const td = today();
  const arr = data.programmation.map((x, i) => ({ x, i })).sort((a, b) => (a.x.date + (a.x.heure || '')).localeCompare(b.x.date + (b.x.heure || '')));
  const rows = !arr.length ? '<p class="meta">Aucun programme pour le moment.</p>' : arr.map(({ x, i }) => `<div class="item"><div class="row" style="gap:12px;align-items:center;flex:1">${x.image ? `<img src="${esc(x.image)}" alt="" style="width:96px;height:54px;object-fit:cover;border-radius:8px">` : ''}<span class="t"><b>${esc(x.titre)}</b><span class="meta">${esc(x.date)}${x.heure ? ' · ' + esc(x.heure) : ''}${x.date < td ? ' · passé' : ''}</span></span></div><button class="btn small danger" data-delprog="${i}">Supprimer</button></div>`).join('');
  return `<div class="panel"><h2>Programmation des directs</h2>
    <p class="meta">Ces programmes s'affichent sur la page Direct, dans l'onglet « À suivre », tant que leur date n'est pas passée.</p>
    <div class="grid2"><div><label for="pgd">Date</label><input id="pgd" type="date" value="${td}"></div><div><label for="pgh">Heure</label><input id="pgh" type="time" value="09:00"></div></div>
    <label for="pgt">Titre</label><input id="pgt" type="text" maxlength="150" placeholder="Ex : Culte de louange">
    <label for="pgx">Description (facultative)</label><textarea id="pgx" maxlength="500"></textarea>
    <label for="pgi">Image (facultative)</label><input id="pgi" type="file" accept="image/*">
    <p style="margin-top:14px"><button class="btn" id="pgadd">Ajouter à la programmation</button> <span id="pgst"></span></p>
    <h3 style="margin:22px 0 8px;font-size:1rem">Programmes enregistrés</h3>${rows}</div>`;
}
function bindProgrammation() {
  $('#pgadd').onclick = async () => {
    const titre = $('#pgt').value.trim(), date = $('#pgd').value; if (!titre || !date) return status($('#pgst'), 'Indiquez au moins une date et un titre.', false);
    const f = $('#pgi').files[0]; $('#pgadd').disabled = true; status($('#pgst'), 'Enregistrement…');
    const entry = { date, heure: $('#pgh').value, titre, description: $('#pgx').value.trim() }; let up = '', pushed = false;
    try {
      if (f) { const blob = await resizeImage(f, 1200); up = `programmation/${slug(titre)}-${Date.now().toString(36)}.jpg`; await putFile(up, await fileB64(blob), 'Image du programme : ' + titre); entry.image = up; }
      data.programmation.push(clean(entry)); pushed = true; await saveData('Programme : ' + titre); start();
    } catch (e) { if (pushed) data.programmation.pop(); status($('#pgst'), e.message, false); $('#pgadd').disabled = false; }
  };
  document.querySelectorAll('[data-delprog]').forEach((b) => (b.onclick = async () => {
    const i = +b.dataset.delprog, it = data.programmation[i]; if (!confirm(`Supprimer « ${it.titre} » ?`)) return;
    data.programmation.splice(i, 1); b.disabled = true;
    try { await saveData('Supprimer le programme : ' + it.titre); if (it.image && /^programmation\//.test(it.image)) await deleteFile(it.image); } catch (e) { data.programmation.splice(i, 0, it); alert(e.message); }
    start();
  }));
}

function directView() {
  const d = data.direct;
  app.innerHTML = `<div class="panel" id="ctl"></div>
    <div class="panel"><h2>Réglages du direct</h2>

const VMAX = 60 * 1048576;
function videoThumb(file) {
  return new Promise((res) => {
    const v = document.createElement('video'), u = URL.createObjectURL(file); let done = false;
    const end = (b) => { if (done) return; done = true; URL.revokeObjectURL(u); res(b); };
    v.muted = true; v.playsInline = true; v.preload = 'metadata'; v.src = u;
    v.onloadedmetadata = () => { v.currentTime = Math.min(1, (v.duration || 2) / 2); };
    v.onseeked = () => { try { const w = Math.min(640, v.videoWidth || 640), h = Math.round(w * (v.videoHeight || 360) / (v.videoWidth || 640)); const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(v, 0, 0, w, h); c.toBlob((b) => end(b), 'image/jpeg', 0.8); } catch { end(null); } };
    v.onerror = () => end(null); setTimeout(() => end(null), 8000);
  });
}

    <label class="sw" style="margin-top:12px"><input type="checkbox" id="vr"> C'est la rediffusion d'un direct</label>
    <p style="margin-top:14px"><button class="btn" id="add">Ajouter</button> <span id="st"></span></p></div>
    ${emissionsPanel()}
    <div class="panel"><h2>Vidéos publiées</h2>${listHtml('videos')}</div>`;
  bindEmissions();
  $('#add').onclick = async () => {
    const f = $('#vf').files[0], id = ytId($('#vy').value);
    const titre = $('#vt').value.trim() || (f ? f.name.replace(/\.[^.]+$/, '') : '');
    if (!titre) return status($('#st'), 'Donnez un titre.', false);
    if (!f && !id) return status($('#st'), 'Choisissez un fichier vidéo ou collez un lien YouTube.', false);
    if (f && f.size > VMAX) return status($('#st'), `Vidéo trop lourde (${Math.round(f.size / 1048576)} Mo, maximum 60 Mo). Mettez-la sur YouTube et collez le lien.`, false);
    $('#add').disabled = true;
    const entry = { titre, date: $('#vd').value || today(), categorie: $('#vc').value, emission: $('#vem').value.trim(), description: $('#vx').value.trim(), direct: $('#vr').checked || undefined };
    const sent = [];
    try {
      if (f) {
        const ext = (f.name.match(/\.[^.]+$/) || ['.mp4'])[0].toLowerCase(), base = `${Date.now()}-${slug(f.name)}`;
        status($('#st'), 'Préparation de la miniature…');
        const th = await videoThumb(f);
        if (th) { const tp = `videos/${base}.jpg`; await putFile(tp, await fileB64(th), 'Miniature ' + f.name); sent.push(tp); entry.miniature = tp; }
        status($('#st'), 'Envoi de la vidéo… patientez, ne fermez pas la page (cela peut durer plusieurs minutes).');
        const vp = `videos/${base}${ext}`; await putFile(vp, await fileB64(f), 'Ajouter la vidéo ' + f.name); sent.push(vp); entry.url = vp;
      } else entry.youtube = id;
      data.videos.push(clean(entry)); status($('#st'), 'Enregistrement…');
      await saveData('Ajouter la vidéo : ' + titre); start();
    } catch (e) {
      if (data.videos[data.videos.length - 1] && data.videos[data.videos.length - 1].titre === titre && sent.length) data.videos.pop();
      for (const q of sent) { try { await deleteFile(q); } catch {} }
      status($('#st'), e.message, false); $('#add').disabled = false;
    }
  };
  $('#vf').onchange = () => { const f = $('#vf').files[0]; $('#vfi').textContent = f ? `${f.name} · ${Math.round(f.size / 1048576)} Mo${f.size > VMAX ? ' : trop lourd (60 Mo maximum)' : ''}` : ''; };
  bindList('videos');
}

/* Photos : albums (playlists), envoi de 100 photos et plus en une fois */
function photoAlbums() {
  const m = new Map();
  data.photos.forEach((p, i) => { const n = p.album || 'Autres photos'; if (!m.has(n)) m.set(n, []); m.get(n).push(i); });
  return [...m.entries()].map(([name, idx]) => ({ name, idx })).sort((a, b) => String(data.photos[b.idx[0]].date).localeCompare(String(data.photos[a.idx[0]].date)));
}
function photosView() {
  const albums = photoAlbums();
  const albumsHtml = !albums.length ? '<p class="meta">Rien pour le moment.</p>' : albums.map((a, k) => {
    const cover = data.photos[a.idx[0]];
    return `<details class="item" style="display:block"><summary style="cursor:pointer;display:flex;gap:12px;align-items:center"><img src="${esc(cover.miniature || cover.url)}" alt="" style="width:64px;height:48px;object-fit:cover;border-radius:8px"><span class="t" style="flex:1"><b>${esc(a.name)}</b><span class="meta"> ${a.idx.length} photo${a.idx.length > 1 ? 's' : ''} · ${esc(cover.date || '')}</span></span></summary>
      <p style="margin:12px 0"><button class="btn small ghost" data-ren="${k}">Renommer l'album</button> <button class="btn small danger" data-delalb="${k}">Supprimer l'album (${a.idx.length})</button></p>
      <div class="thumbs">${a.idx.map((i) => `<span class="th"><img loading="lazy" src="${esc(data.photos[i].miniature || data.photos[i].url)}" alt=""><button type="button" class="btn small danger" data-delone="${i}" aria-label="Supprimer cette photo">×</button></span>`).join('')}</div></details>`;
  }).join('');
  app.innerHTML = `<div class="panel"><h2>Ajouter des photos</h2>
    <p class="meta">Choisissez autant de photos que vous voulez (100, 200…) : elles sont envoyées en une seule fois et classées dans un <b>album</b>, dans l'ordre. Elles sont réduites automatiquement pour que le site reste rapide.</p>
    <label for="pf">Photos</label><input id="pf" type="file" accept="image/*" multiple>
    <p class="meta" id="pcount"></p>
    <div class="grid2"><div><label for="pa">Nom de l'album</label><input id="pa" type="text" maxlength="120" list="alist" placeholder="Ex : Baptême du 5 octobre"><datalist id="alist">${albums.map((a) => `<option value="${esc(a.name)}">`).join('')}</datalist></div>
    <div><label for="pd">Date</label><input id="pd" type="date" value="${today()}"></div></div>
    <label for="px">Légende (facultative, pour toutes les photos)</label><input id="px" type="text" maxlength="500">
    <div class="progress"><i id="bar"></i></div>
    <p style="margin-top:14px"><button class="btn" id="add">Envoyer</button> <span id="st"></span></p></div>
    <div class="panel"><h2>Albums publiés</h2>${albumsHtml}</div>`;
  $('#pf').onchange = () => { const n = $('#pf').files.length; $('#pcount').textContent = n ? `${n} photo${n > 1 ? 's' : ''} sélectionnée${n > 1 ? 's' : ''}.` : ''; if (n && !$('#pa').value) $('#pa').value = ''; };
  $('#add').onclick = async () => {
    const files = [...$('#pf').files].sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
    if (!files.length) return status($('#st'), 'Choisissez au moins une photo.', false);
    const album = $('#pa').value.trim(); if (!album) return status($('#st'), "Donnez un nom à l'album (c'est lui qui regroupe les photos).", false);
    $('#add').disabled = true; const stamp = Date.now().toString(36); const folder = `photos/${slug(album)}-${stamp}`;
    const out = [], added = [];
    try {
      for (let n = 0; n < files.length; n++) {
        status($('#st'), `Préparation ${n + 1} / ${files.length}…`);
        $('#bar').style.width = Math.round((n / files.length) * 40) + '%';
        const full = await resizeImage(files[n], 1600), thumb = await resizeImage(files[n], 520, 0.78);
        const name = String(n + 1).padStart(4, '0') + '-' + slug(files[n].name);
        const p = `${folder}/${name}.jpg`, t = `${folder}/t-${name}.jpg`;
        out.push({ path: p, b64: await fileB64(full) }, { path: t, b64: await fileB64(thumb) });
        added.push(clean({ titre: album, album, date: $('#pd').value || today(), url: p, miniature: t, description: $('#px').value.trim() }));
      }
      data.photos.push(...added);
      await commitBatch(out, [], `Ajouter l'album « ${album} » (${files.length} photos)`, (d, t) => { $('#bar').style.width = 40 + Math.round((d / t) * 60) + '%'; status($('#st'), `Envoi ${d} / ${t}…`); });
      start();
    } catch (e) {
      data.photos.splice(data.photos.length - added.length, added.length);
      status($('#st'), e.message, false); $('#add').disabled = false;
    }
  };
  document.querySelectorAll('[data-ren]').forEach((b) => (b.onclick = async () => {
    const a = albums[+b.dataset.ren]; const nn = (prompt("Nouveau nom de l'album :", a.name) || '').trim(); if (!nn || nn === a.name) return;
    a.idx.forEach((i) => { data.photos[i].album = nn; data.photos[i].titre = nn; }); b.disabled = true;
    try { await saveData(`Renommer l'album : ${nn}`); } catch (e) { alert(e.message); }
    start();
  }));
  document.querySelectorAll('[data-delalb]').forEach((b) => (b.onclick = async () => {
    const a = albums[+b.dataset.delalb]; if (!confirm(`Supprimer l'album « ${a.name} » et ses ${a.idx.length} photos ?`)) return;
    const gone = new Set(a.idx), paths = []; a.idx.forEach((i) => { const p = data.photos[i]; if (p.url) paths.push(p.url); if (p.miniature) paths.push(p.miniature); });
    const keep = data.photos.filter((_, i) => !gone.has(i)), old = data.photos; data.photos = keep; b.disabled = true;
    try { await commitBatch([], paths.filter((p) => /^photos\//.test(p)), `Supprimer l'album : ${a.name}`); } catch (e) { data.photos = old; alert(e.message); }
    start();
  }));
  document.querySelectorAll('[data-delone]').forEach((b) => (b.onclick = async () => {
    const i = +b.dataset.delone, p = data.photos[i]; if (!confirm('Supprimer cette photo ?')) return;
    data.photos.splice(i, 1); b.disabled = true;
    try { await commitBatch([], [p.url, p.miniature].filter((x) => x && /^photos\//.test(x)), 'Supprimer une photo'); } catch (e) { data.photos.splice(i, 0, p); alert(e.message); }
    start();
  }));
}

/* Audios */
function audiosView() {
  app.innerHTML = `<div class="panel"><h2>Ajouter un audio</h2>
    <p class="meta">Fichier MP3 ou M4A jusqu'à 25 Mo (environ 25 minutes en qualité correcte). Pour un fichier plus gros, collez un lien direct vers le fichier.</p>
    <label for="af">Fichier audio</label><input id="af" type="file" accept="audio/*,.mp3,.m4a">
    <label for="aimg">Affiche (image, facultative) <span class="meta">— s'affiche au-dessus de l'audio</span></label><input id="aimg" type="file" accept="image/*">
    <label for="au">… ou lien direct vers le fichier</label><input id="au" type="url" placeholder="https://…/message.mp3">
    <div class="grid2"><div><label for="at">Titre</label><input id="at" type="text" maxlength="150"></div>
    <div><label for="ad">Date</label><input id="ad" type="date" value="${today()}"></div></div>
    <label for="ac">Partie du site</label>${catSelect('ac', 'dimanche')}
    <label for="ax">Légende (facultative, affichée sous le titre)</label><textarea id="ax" maxlength="1000" placeholder="Ex : Prédication du dimanche, texte : Jean 3."></textarea>
    <p style="margin-top:14px"><button class="btn" id="add">Ajouter</button> <span id="st"></span></p></div>
    <div class="panel"><h2>Audios publiés</h2>${listHtml('audios')}</div>`;
  $('#add').onclick = async () => {
    const f = $('#af').files[0], link = $('#au').value.trim();
    let titre = $('#at').value.trim() || (f ? f.name.replace(/\.[^.]+$/, '') : '');
    if (!titre) return status($('#st'), 'Donnez un titre.', false);
    if (!f && !link) return status($('#st'), 'Choisissez un fichier ou collez un lien.', false);
    if (f && f.size > 25 * 1048576) return status($('#st'), 'Fichier trop gros (25 Mo maximum). Utilisez un lien direct.', false);
    $('#add').disabled = true; status($('#st'), 'Envoi en cours…');
    try {
      let url = link;
      if (f) { const ext = (f.name.match(/\.[^.]+$/) || ['.mp3'])[0].toLowerCase(); url = `audios/${Date.now()}-${slug(f.name)}${ext}`; await putFile(url, await fileB64(f), 'Ajouter l’audio ' + f.name); }
      let affiche = ''; const fi = $('#aimg').files[0];
      if (fi) { affiche = `audios/aff-${Date.now()}-${slug(fi.name)}.jpg`; await putFile(affiche, await fileB64(await resizeImage(fi, 1000)), 'Affiche : ' + titre); }
      data.audios.push(clean({ titre, date: $('#ad').value || today(), url, categorie: $('#ac').value, description: $('#ax').value.trim(), affiche }));
      await saveData('Ajouter l’audio : ' + titre); start();
    } catch (e) { status($('#st'), e.message, false); $('#add').disabled = false; }
  };
  bindList('audios');
}

start();
</script>
</body>
</html>
